name: Unit tests & PHPCS

on:
  push:

# Both jobs only check the code out and run its tests.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-code-style:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        php: ['7.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit --bootstrap __tests__/bootstrap.php __tests__

      - name: Run SDK tests
        run: vendor/bin/phpunit -v -c ./phpunit-sdk-unit.xml

      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml --extensions=php --ignore=vendor/ .

  js-unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The JS unit tests run on Jest, a dev dependency.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run JS unit tests
        run: npm run test:js
