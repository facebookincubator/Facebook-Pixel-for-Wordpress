name: Set Stable Tag
run-name: "Set Stable Tag ${{ github.ref_name }} by @${{ github.actor }}"

on: workflow_dispatch

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set-stable-tag:
    runs-on: ubuntu-latest
    environment: Deployment
    outputs:
      version: ${{ steps.package-version.outputs.current-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Fail if not on a release publish branch
        run: |
          echo "Current ref: ${{ github.ref }}"
          BRANCH="${{ github.ref }}"
          if [[ ! $BRANCH == refs/heads/release/p*/publish ]]; then
            echo "❌ This workflow can only be run on release/p<VERSION>/publish branches."
            exit 1
          fi

      - name: Get NPM Version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: Compare marketplace artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package-version.outputs.current-version }}
        run: |
          set -e

          TEMP_DIR=$(mktemp -d)
          trap "rm -rf $TEMP_DIR" EXIT

          echo "🔍 Verifying that the WordPress.org marketplace build matches the latest changes on release/$VERSION (Meta Pixel for WordPress v$VERSION)"

          # Download the currently published plugin from WordPress.org
          echo "⬇️  Downloading the published plugin from the WordPress.org marketplace..."
          curl -sL "https://downloads.wordpress.org/plugin/official-facebook-pixel.zip" \
            -o "$TEMP_DIR/marketplace.zip"

          # Resolve the exact commit currently at the tip of release/$VERSION. We must
          # compare the marketplace against a build of THIS commit so we never validate
          # against a stale or still-running build of an older commit.
          BRANCH_SHA=$(gh api "repos/${{ github.repository }}/branches/release/$VERSION" --jq '.commit.sha')
          echo "📌 Latest commit on release/$VERSION is $BRANCH_SHA"

          # Locate the build artifact for that exact commit.
          # build-and-upload.yml builds on every push to the release branch, so a build
          # for the current HEAD is always produced. It may still be in progress when this
          # workflow runs, so poll for up to 5 minutes for a SUCCESSFUL build whose commit
          # SHA matches release/$VERSION's HEAD before giving up.
          echo "🔎 Looking for a successful build of release/$VERSION at commit $BRANCH_SHA..."
          MAX_ATTEMPTS=30
          SLEEP_SECONDS=10
          RUN_ID=""
          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
              RUN_ID=$(gh run list \
                --repo ${{ github.repository }} \
                --workflow build-and-upload.yml \
                --branch "release/$VERSION" \
                --status success \
                --limit 50 \
                --json databaseId,headSha \
                --jq "[.[] | select(.headSha == \"$BRANCH_SHA\")][0].databaseId")
              if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
                  echo "✅ Found successful build (run id $RUN_ID) for commit $BRANCH_SHA"
                  break
              fi
              RUN_ID=""
              echo "⏳ No successful build for commit $BRANCH_SHA yet — it may still be running. Waiting ${SLEEP_SECONDS}s (attempt ${ATTEMPT}/${MAX_ATTEMPTS})..."
              sleep "$SLEEP_SECONDS"
          done

          if [ -z "$RUN_ID" ]; then
              echo "❌ Could not find a successful build of release/$VERSION at commit $BRANCH_SHA after $((MAX_ATTEMPTS * SLEEP_SECONDS / 60)) minutes."
              echo "   This usually means one of the following:"
              echo "     • The build for this commit is still running or queued — wait for it to finish, then re-run this workflow."
              echo "     • The build for this commit failed — check the 'Build and Upload Artifact' workflow runs for release/$VERSION and fix the build."
              echo "     • No build was ever triggered for this commit — trigger one with:"
              echo "         gh workflow run build-and-upload.yml --ref release/$VERSION"
              echo "       then wait for it to succeed and re-run this workflow."
              exit 1
          fi

          echo "⬇️  Downloading the build artifact from run $RUN_ID..."
          gh run download "$RUN_ID" --repo ${{ github.repository }} --dir "$TEMP_DIR/artifact"

          # Find and prepare GitHub zip
          ARTIFACT_ZIP=$(find "$TEMP_DIR/artifact" -name "*.zip" -type f | sort | head -1)
          if [ -z "$ARTIFACT_ZIP" ]; then
              PLUGIN_FILE=$(find "$TEMP_DIR/artifact" -name "class-facebookpluginconfig.php" -type f | sort | head -1)
              if [ -n "$PLUGIN_FILE" ]; then
                  PLUGIN_DIR=$(dirname "$(dirname "$PLUGIN_FILE")")
                  (cd "$(dirname "$PLUGIN_DIR")" && zip -rq "$TEMP_DIR/github.zip" "$(basename "$PLUGIN_DIR")")
                  ARTIFACT_ZIP="$TEMP_DIR/github.zip"
              fi
          fi
          [ -z "$ARTIFACT_ZIP" ] && echo "❌ No artifact found" && exit 1

          # Extract and compare
          mkdir -p "$TEMP_DIR/wp" "$TEMP_DIR/gh"
          unzip -q "$TEMP_DIR/marketplace.zip" -d "$TEMP_DIR/wp"
          unzip -q "$ARTIFACT_ZIP" -d "$TEMP_DIR/gh"

          # Compare directories (ignore .gitignore)
          echo "Comparing archives..."
          DIFF_OUTPUT=$(diff -rq --exclude='.gitignore' "$TEMP_DIR/wp" "$TEMP_DIR/gh" 2>&1 || true)

          # For .pot files, check if differences are only timestamps
          REAL_DIFFS=""
          while IFS= read -r line; do
              if echo "$line" | grep -q '\.pot '; then
                  FILE_A=$(echo "$line" | sed 's/^Files \(.*\) and .* differ$/\1/')
                  FILE_B=$(echo "$line" | sed 's/^Files .* and \(.*\) differ$/\1/')
                  POT_DIFF=$(diff "$FILE_A" "$FILE_B" \
                    | grep -v "^[<>] \"POT-Creation-Date:" \
                    | grep -v "^[<>] \"PO-Revision-Date:" \
                    | grep "^[<>]" || true)
                  if [ -n "$POT_DIFF" ]; then
                      REAL_DIFFS="${REAL_DIFFS}${line}\n"
                  fi
              elif echo "$line" | grep -q 'installed\.php '; then
                  FILE_A=$(echo "$line" | sed 's/^Files \(.*\) and .* differ$/\1/')
                  FILE_B=$(echo "$line" | sed 's/^Files .* and \(.*\) differ$/\1/')
                  INSTALLED_DIFF=$(php -r '
                    $a = require $argv[1];
                    $b = require $argv[2];
                    $root = $a["root"]["name"];
                    $diffs = [];
                    foreach ($a["versions"] as $pkg => $info) {
                      if ($pkg === $root) continue;
                      $va = $info["pretty_version"] ?? $info["version"] ?? null;
                      $vb = $b["versions"][$pkg]["pretty_version"] ?? $b["versions"][$pkg]["version"] ?? null;
                      if ($va !== $vb) $diffs[] = "$pkg: $va vs $vb";
                    }
                    foreach ($b["versions"] as $pkg => $info) {
                      if ($pkg === $root) continue;
                      if (!isset($a["versions"][$pkg])) $diffs[] = "$pkg: missing in marketplace";
                    }
                    echo implode("\n", $diffs);
                  ' "$FILE_A" "$FILE_B" || true)
                  if [ -n "$INSTALLED_DIFF" ]; then
                      echo "Dependency differences: $INSTALLED_DIFF"
                      REAL_DIFFS="${REAL_DIFFS}${line}\n"
                  fi
              else
                  REAL_DIFFS="${REAL_DIFFS}${line}\n"
              fi
          done <<< "$DIFF_OUTPUT"

          REAL_DIFFS=$(echo -e "$REAL_DIFFS" | sed '/^$/d')

          if [ -n "$REAL_DIFFS" ]; then
              echo "❌ Differences found:"
              echo "$REAL_DIFFS"
              exit 1
          fi

          echo "✅ Artifacts match"

      - name: Install SVN
        run: sudo apt-get install subversion -y

      - name: Checkout SVN Repository
        run: svn co https://plugins.svn.wordpress.org/official-facebook-pixel/ pixel_svn --quiet --non-interactive

      - name: Validate SVN tag
        run: |
          if [ ! -d "pixel_svn/tags/${{ steps.package-version.outputs.current-version }}" ]; then
            echo "❌ SVN tag directory does not exist" 1>&2
            exit 1
          fi

      - name: Update readme.txt
        env:
          NEW_VERSION: ${{ steps.package-version.outputs.current-version }}
        run: |
          cd pixel_svn
          sed -i -E "s/^(Stable tag:)[[:space:]]*[0-9.]+/\1 $NEW_VERSION/" "trunk/readme.txt"

      - name: Commit to SVN
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          cd pixel_svn
          cat trunk/readme.txt
          svn status
          svn diff
          svn commit -m "Update stable tag for version ${{ steps.package-version.outputs.current-version }}" \
            --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
            --no-auth-cache --non-interactive

  create-release-pr:
    needs: set-stable-tag
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.set-stable-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/${{ needs.set-stable-tag.outputs.version }}

      - name: Update stable tag in readme.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i -E "s/^(Stable tag:)[[:space:]]*[0-9.]+/\1 $VERSION/" "readme.txt"
          git add readme.txt
          git commit -m "Update stable tag to $VERSION"
          git push origin HEAD

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v$VERSION" \
            --repo ${{ github.repository }} \
            --draft=false \
            --prerelease=false \
            --latest

      - name: Validate Git tag
        run: |
          git fetch --tags
          if [ -z "$(git tag -l "v$VERSION")" ]; then
            echo "❌ Git tag v$VERSION does not exist" 1>&2
            exit 1
          fi

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" --repo ${{ github.repository }} \
            --json body --jq '.body' > /tmp/release-notes.md
          EXISTING_PR=$(gh pr list \
            --repo ${{ github.repository }} \
            --head "release/$VERSION" \
            --base main \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for release/$VERSION, skipping creation"
          else
            gh pr create \
              --repo ${{ github.repository }} \
              --base main \
              --head "release/$VERSION" \
              --title "Release $VERSION" \
              --body-file /tmp/release-notes.md
          fi
