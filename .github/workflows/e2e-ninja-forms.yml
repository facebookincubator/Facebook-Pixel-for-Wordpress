name: E2E - Ninja Forms

# Lead event E2E coverage for the Ninja Forms integration
# (integration/class-facebookwordpressninjaforms.php).
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    uses: ./.github/workflows/e2e-reusable.yml
    with:
      grep: '@lead-ninja-forms'
    secrets: inherit
